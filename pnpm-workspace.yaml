packages:
  - "packages/*"
  - "apps/*"
  - "crates/*"
allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: set this to true or false
  electron: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@vibecook/mille-darwin-arm64@0.3.0 || 0.3.1'
  - '@vibecook/mille-darwin-x64@0.3.0 || 0.3.1'
  - '@vibecook/mille-linux-arm64-gnu@0.3.0 || 0.3.1'
  - '@vibecook/mille-linux-arm64-musl@0.3.0 || 0.3.1'
  - '@vibecook/mille-linux-x64-gnu@0.3.0 || 0.3.1'
  - '@vibecook/mille-linux-x64-musl@0.3.0 || 0.3.1'
  - '@vibecook/mille-ui@0.3.0 || 0.3.1'
  - '@vibecook/mille-win32-arm64-msvc@0.3.0 || 0.3.1'
  - '@vibecook/mille-win32-x64-msvc@0.3.0 || 0.3.1'
  - '@vibecook/mille@0.3.0 || 0.3.1'
onlyBuiltDependencies:
  - esbuild
  - electron
# Pin older electron-to-chromium so minimumReleaseAge supply-chain checks pass
# (browserslist sometimes pulls a too-fresh e2c release).
overrides:
  electron-to-chromium: 1.5.321
