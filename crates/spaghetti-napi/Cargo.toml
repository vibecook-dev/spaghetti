[package]
name = "spaghetti-napi"
version = "0.7.0" # x-release-please-version
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NAPI-RS bindings for the spaghetti ingest core (published to npm, not crates.io)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Repository-only differential oracle for the superseded bulk/live writer.
# Published native builds intentionally omit this feature.
legacy-oracle = []

[lints]
workspace = true

[dependencies]
# NAPI
napi.workspace = true
napi-derive.workspace = true

# JSON
sonic-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sha2.workspace = true
zstd.workspace = true

# SQLite
rusqlite.workspace = true

# Concurrency
crossbeam-channel.workspace = true
rayon.workspace = true
tokio.workspace = true

# Errors
thiserror.workspace = true
anyhow.workspace = true

# Tracing
tracing.workspace = true
tracing-subscriber.workspace = true

# Filesystem / text
walkdir.workspace = true
notify.workspace = true
regex.workspace = true
once_cell.workspace = true
blake3.workspace = true
rustix.workspace = true

# Time formatting
time.workspace = true
tiktoken-rs = { version = "0.12.0", default-features = false }
spaghetti-coverage = { path = "../spaghetti-coverage" }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
napi-build.workspace = true
