name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # No `version:` — action-setup reads `packageManager` from package.json.
      # `overrides` / `onlyBuiltDependencies` live in pnpm-workspace.yaml, which
      # only pnpm >= 10 reads; a pinned pnpm 9 here sees no overrides and fails
      # --frozen-lockfile with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # `pnpm build` regenerates three committed artifacts: the napi loader
      # (crates/spaghetti-napi/index.js), Cargo.lock, and the SDK's bundled
      # parse-worker.js. Nothing checked they stayed current, so they rotted
      # silently — parse-worker.js had drifted into a fork of the project
      # parser still importing the long-deleted `packages/core`, and would
      # have kept its own stale copy of any parser fix.
      #
      # Unlike the lint/format/ingest-diff steps below, this one is genuinely
      # platform-independent: the generators read committed inputs and emit
      # identical bytes on every host. Running it once is the whole signal,
      # and confining it to one runner avoids failing on incidental
      # cross-platform differences in generated output.
      - name: Generated files are current
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- Cargo.lock crates/spaghetti-napi packages/sdk/src/workers/parse-worker.js
      - name: Typecheck
        run: pnpm typecheck
      # Run BOTH the SDK and CLI suites (test:packages). The `@vibecook/spaghetti`
      # filter alone matched only the CLI. The SDK suite needs the built native
      # addon + better-sqlite3, both present here: `pnpm build` above ran
      # `pnpm -r build` (which builds the native crate) and better-sqlite3 is a
      # root devDependency installed by the frozen-lockfile step.
      - name: Test
        run: pnpm test:packages
      # These five ran on ubuntu only, which is precisely why Windows could
      # report green while `spag sessions .` was broken there: the ingest
      # diffs are the rs-vs-ts parity gate (the one check that would have
      # caught a platform-specific slug decoder), and lint/format failed on
      # Windows for reasons that had nothing to do with the code being wrong
      # — single-quoted globs the Windows shell doesn't strip, and a CRLF
      # worktree. Both are fixed; run them everywhere so they stay fixed.
      - name: Ingest diff (small fixture)
        run: pnpm test:ingest-diff
      - name: Ingest diff (medium fixture)
        run: pnpm test:ingest-diff:medium
      - name: Ingest diff (Grok small fixture)
        run: pnpm test:ingest-diff:grok
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm run format:check

  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- --deny warnings
      - name: cargo test
        run: cargo test --workspace
