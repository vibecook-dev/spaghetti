# TEMPORARY — verification only, delete before merging.
#
# Answers one question that cannot be settled locally: can windows-latest
# cross-compile aarch64-pc-windows-msvc? rusqlite's `bundled` feature
# compiles SQLite from C via the cc crate, so the build needs an MSVC
# toolset targeting ARM64, not just the Rust std for that target.
#
# napi-build.yml cannot be used for this: it is workflow_dispatch-only and
# its publish job has no condition, so dispatching it to test a build would
# also attempt an npm publish. release.yml dispatches it with no inputs, so
# adding a `publish` input would silently stop releases from publishing.
# Hence a throwaway pull_request-triggered probe instead.

name: ARM64 probe (temporary)

on:
  pull_request:
    branches: [main]

jobs:
  cross-compile:
    name: Cross-compile aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Show MSVC toolsets present on the image
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -property installationPath
          Get-ChildItem "$(& $vswhere -latest -property installationPath)\VC\Tools\MSVC" |
            ForEach-Object { Get-ChildItem "$($_.FullName)\bin\Hostx64" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name }
      - name: Install dependencies
        run: |
          cd crates/spaghetti-napi
          npm install
      - name: Build native addon (ARM64)
        run: |
          cd crates/spaghetti-napi
          npx napi build --platform --release --target aarch64-pc-windows-msvc
      - name: Show artifact
        shell: bash
        run: ls -la crates/spaghetti-napi/*.node
      - uses: actions/upload-artifact@v4
        with:
          name: probe-bindings-aarch64-pc-windows-msvc
          path: crates/spaghetti-napi/*.node
          if-no-files-found: error

  smoke-test:
    name: Load on real ARM64 hardware
    needs: cross-compile
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: |
          cd crates/spaghetti-napi
          npm install
      - uses: actions/download-artifact@v4
        with:
          name: probe-bindings-aarch64-pc-windows-msvc
          path: crates/spaghetti-napi
      - name: require() the binary
        run: |
          cd crates/spaghetti-napi
          node -e "const m = require('./index.js'); if (!m.nativeVersion) { throw new Error('nativeVersion export missing'); } console.log('Loaded OK on', process.platform, process.arch, '- nativeVersion =', m.nativeVersion());"
