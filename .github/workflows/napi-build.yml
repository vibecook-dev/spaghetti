name: NAPI Build

# Builds @vibecook/spaghetti-sdk-native for all 6 targets, require()-loads
# every resulting .node binary on a matching host, and (when dispatched with
# `publish=true`) publishes the single fat main package to npm with provenance.
#
# release.yml passes that input; a bare manual dispatch builds and tests only.
#
# It also runs automatically on release-please's release PR (build + test, never
# publish) so a broken native build costs a CI run instead of a burned version —
# see the `pull_request` trigger below.

env:
  DEBUG: napi:*
  MACOSX_DEPLOYMENT_TARGET: '10.13'

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish @vibecook/spaghetti-sdk-native to npm after the binaries pass their load checks'
        type: boolean
        default: false
      source_ref:
        description: 'Tag/branch to build from. Leave empty to build the ref this run was dispatched against.'
        type: string
        default: ''

  # Release PRs only (filtered per-job on github.head_ref — `branches:` here
  # matches the BASE branch, not the head). The tag is cut the moment this PR
  # merges, and a workflow_dispatch always reads its own definition from the ref
  # it targets, so a workflow bug that reaches a tag cannot be fixed for that
  # tag by a later commit on main. This PR run is the last point where the
  # 6-target matrix is checked while a version can still be *not* released.
  pull_request:
    branches: [main]

# Grouped by event so a PR run can never share a group with — and therefore
# never queue behind or cancel — a release's publishing dispatch. Only PR runs
# cancel: release-please force-pushes its branch on every merge to main, and
# each force-push would otherwise leave 6 superseded runners building.
concurrency:
  group: napi-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: |
              cd crates/spaghetti-napi
              npx napi build --platform --release --target aarch64-apple-darwin
              strip -x *.node

          - host: macos-latest
            target: x86_64-apple-darwin
            build: |
              cd crates/spaghetti-napi
              npx napi build --platform --release --target x86_64-apple-darwin
              strip -x *.node

          # Pinned, not `ubuntu-latest`. The build host's glibc becomes the
          # artifact's minimum, so a floating host silently raises the floor
          # for users the day GitHub moves the label — which is exactly what
          # RFC 008 Phase 4 means by a pinned baseline. 22.04 ships glibc
          # 2.35; `ubuntu-latest` is 24.04 and would demand 2.39, excluding
          # Ubuntu 22.04 LTS and Debian 12. If this runner is retired the
          # build fails loudly, which is the right failure mode — better than
          # quietly shipping a narrower artifact.
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            build: |
              cd crates/spaghetti-napi
              npx napi build --platform --release --target x86_64-unknown-linux-gnu
              strip *.node

          - host: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            build: |
              cd crates/spaghetti-napi
              npx napi build --platform --release --target aarch64-unknown-linux-gnu
              aarch64-linux-gnu-strip *.node

          # musl, for Alpine and other non-glibc Linux. Without these an
          # Alpine container is x64 Linux with no loadable artifact — it
          # silently fell back to the TypeScript engine, which looks exactly
          # like an unsupported platform (RFC 008 Phase 4).
          #
          # Built inside Alpine via an explicit `docker run`, with checkout and
          # caching staying on the host. Three earlier approaches failed, each
          # for a reason worth not repeating:
          #
          #  - `musl-tools`' `musl-gcc` wrapper cannot link a cdylib: it passes
          #    `-lgcc_s` for dynamic linking and musl has no such library
          #    (`cannot find libgcc_s.so.1`).
          #  - Fetching a cross toolchain from musl.cc put a single
          #    third-party host in the release path; it was unreachable.
          #  - A job-level `container:` cannot work for arm64 — GitHub only
          #    supports JavaScript actions in Alpine containers on x64
          #    runners, so `actions/checkout` itself fails on an ARM host.
          #
          # `docker run` sidesteps the last of those entirely, because no
          # JavaScript action ever executes inside the container.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: |
              docker run --rm -v "$PWD:/w" -w /w node:24-alpine sh -c '
                apk add --no-cache build-base curl rustup >/dev/null &&
                rustup-init -y --default-toolchain stable --profile minimal                   --target x86_64-unknown-linux-musl >/dev/null &&
                . "$HOME/.cargo/env" &&
                cd crates/spaghetti-napi && npm install --silent &&
                npx napi build --platform --release --target x86_64-unknown-linux-musl &&
                strip *.node'

          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            build: |
              docker run --rm -v "$PWD:/w" -w /w node:24-alpine sh -c '
                apk add --no-cache build-base curl rustup >/dev/null &&
                rustup-init -y --default-toolchain stable --profile minimal                   --target aarch64-unknown-linux-musl >/dev/null &&
                . "$HOME/.cargo/env" &&
                # Even building natively on aarch64 Alpine, an explicit
                # --target makes Rust look for the cross-named linker
                # `aarch64-linux-musl-gcc`. Alpine ships it as plain `gcc`.
                export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc &&
                cd crates/spaghetti-napi && npm install --silent &&
                npx napi build --platform --release --target aarch64-unknown-linux-musl &&
                strip *.node'

          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: |
              cd crates/spaghetti-napi
              npx napi build --platform --release --target x86_64-pc-windows-msvc

          # Cross-compiled from the x64 host, mirroring how aarch64-linux is
          # built on ubuntu-latest: the MSVC ARM64 toolset ships in the
          # windows runner image, so no extra install step is needed. Without
          # this binary Windows-on-ARM silently falls back to the TypeScript
          # ingest path — the loader has always had a `win32-arm64-msvc`
          # branch, it just had nothing to load.
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: |
              cd crates/spaghetti-napi
              npx napi build --platform --release --target aarch64-pc-windows-msvc

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    # On pull_request, run only for release-please's PR. Every other PR is
    # covered by ci.yml, which builds the addon natively on all three hosts;
    # this workflow's value is the cross-compiled targets and the load checks,
    # and those only need to gate the commit that becomes a tag. `test` and
    # `publish` need no matching guard — they `needs:` this job, and a skipped
    # dependency skips its dependents.
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      # pnpm must be on PATH before setup-node, which auto-validates the
      # `packageManager` field in root package.json and fails if missing.
      # We also disable `package-manager-cache` because this job uses
      # `npm install`, not pnpm — leaving the auto-cache on causes the
      # post-step to fail when the pnpm store path doesn't exist.
      - name: Install pnpm
        run: npm install -g pnpm@11.13.1

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v5
        with:
          node-version: 24
          package-manager-cache: false

      # Host toolchain. The musl targets build inside Docker with their own
      # toolchain, so this is unused for them and harmless.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      # Cache the cargo registry + target dir so fat-LTO release builds don't
      # recompile every dependency from scratch on each release. Keyed per
      # target so cross-compiled outputs (e.g. aarch64-linux built on x86 hosts)
      # don't collide with same-host native builds. ci.yml / bench-gate.yml use
      # actions/cache directly; rust-cache is the napi-rs standard and handles
      # target-dir pruning for us.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.settings.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install dependencies
        run: |
          cd crates/spaghetti-napi
          npm install

      - name: Build native addon
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: ${{ matrix.settings.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: bindings-${{ matrix.settings.target }}
          # index.js rides along with the binary. It is generated by `napi
          # build` and gitignored (see RELEASING.md), so it does not exist in a
          # fresh checkout — and neither the test job nor the publish job runs
          # a build. Shipping it as a build output also means the published
          # loader carries the *released* version in its per-platform guards,
          # which a committed copy never did.
          #
          # Both paths share the crates/spaghetti-napi/ prefix, so the archive
          # root is unchanged and consumers still find *.node at the top level.
          path: |
            crates/spaghetti-napi/*.node
            crates/spaghetti-napi/index.js
          if-no-files-found: error

  test:
    name: Test bindings
    needs: build
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      # Every published binary must be require()-loaded before publish. All 6
      # build targets have a matching test host. darwin-x64 runs on the Apple
      # Silicon runner under Rosetta 2 (setup-node architecture: x64 makes the
      # whole job x64) — GitHub's Intel macos-13 runners are retired/starved
      # and jobs targeting them queue indefinitely (stalled the 0.5.19
      # release). ubuntu-24.04-arm is the GitHub-hosted ARM Linux runner.
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
            nodeArch: x64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          # windows-11-arm is the GitHub-hosted ARM Windows runner (free for
          # public repos), so the cross-compiled binary is require()-loaded on
          # real hardware rather than shipped unverified.
          - host: windows-11-arm
            target: aarch64-pc-windows-msvc
          # musl artifacts are load-tested inside Alpine, not on the Ubuntu
          # host. A glibc host would happily load nothing of interest here —
          # the whole point of a musl build is that it works where glibc is
          # absent, and only an Alpine container proves that.
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            dockerImage: node:24-alpine
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            dockerImage: node:24-alpine
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install pnpm
        run: npm install -g pnpm@11.13.1

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v5
        with:
          node-version: 24
          # x64 for the darwin-x64-under-Rosetta entry; empty string falls
          # back to the runner's native architecture.
          architecture: ${{ matrix.settings.nodeArch || '' }}
          package-manager-cache: false

      - name: Install dependencies
        run: |
          cd crates/spaghetti-napi
          npm install

      - name: Download artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crates/spaghetti-napi

      - name: Smoke test bindings
        if: matrix.settings.dockerImage == ''
        run: |
          cd crates/spaghetti-napi
          node -e "const m = require('./index.js'); if (!m.nativeVersion) { throw new Error('nativeVersion export missing'); } console.log('Loaded OK, nativeVersion =', m.nativeVersion());"

      - name: Smoke test bindings (musl / Alpine)
        if: matrix.settings.dockerImage != ''
        run: |
          docker run --rm             -v "$PWD/crates/spaghetti-napi:/addon"             -w /addon             ${{ matrix.settings.dockerImage }}             node -e "const m = require('./index.js'); if (!m.nativeVersion) { throw new Error('nativeVersion export missing'); } console.log('Loaded OK on musl, nativeVersion =', m.nativeVersion());"

  # Gated on an explicit input. The header calls workflow_dispatch "useful for
  # debugging", but until this gate existed every dispatch ran the matrix and
  # then attempted an npm publish — so there was no way to exercise a build
  # without reaching for the registry. release.yml passes `-f publish=true`.
  publish:
    name: Publish to npm
    needs: [test]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # MUST match the ref the matrix built. This job never builds — it reads
      # the version straight out of package.json and publishes under it — so a
      # mismatch here would ship the binaries of one ref under the version
      # number of another.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install pnpm
        run: npm install -g pnpm@11.13.1

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v5
        with:
          node-version: 24
          # This job uses `npm install` under crates/spaghetti-napi, not pnpm,
          # so disable auto-cache to avoid post-step path validation errors.
          package-manager-cache: false

      - name: Install dependencies
        run: |
          cd crates/spaghetti-napi
          npm install

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: crates/spaghetti-napi/artifacts

      - name: Move artifacts
        run: |
          cd crates/spaghetti-napi
          npx napi artifacts

      # `napi artifacts` only relocates *.node, and this job never builds, so
      # the generated loader has to be lifted out of an artifact by hand.
      # Every target emits the same file — it branches on all platforms napi
      # knows about, not the triple it was built for — so any one will do.
      #
      # Failing loudly here matters: `files` in package.json silently skips
      # entries that are missing on disk, so without this the job would happily
      # publish a package whose `main` points at a file that isn't in it.
      - name: Restore the generated loader
        run: |
          set -euo pipefail
          cd crates/spaghetti-napi
          LOADER=$(find artifacts -name index.js -type f -print -quit)
          if [ -z "$LOADER" ]; then
            echo "::error::No index.js among the downloaded artifacts — refusing to publish a package with no loader."
            exit 1
          fi
          cp "$LOADER" ./index.js
          echo "Restored loader from $LOADER"

      # Load the exact bytes about to be published. ubuntu-latest matches the
      # linux-x64-gnu binary that `napi artifacts` just placed alongside it, so
      # this exercises the real loader/binary pair rather than trusting that
      # the files merely exist.
      - name: Smoke test the package about to be published
        run: |
          set -euo pipefail
          cd crates/spaghetti-napi
          node -e "const m = require('./index.js'); if (!m.nativeVersion) { throw new Error('nativeVersion export missing'); } console.log('Publishing loader OK, nativeVersion =', m.nativeVersion());"

      # We publish ONLY the main package, which fat-bundles all 6 .node binaries
      # (see its `files: ["*.node"]`). The per-platform packages under
      # crates/spaghetti-napi/npm/* are deliberately NOT published: nothing
      # references them. The proper slim layout would have the main package
      # declare them as optionalDependencies (one per platform), which
      # `napi prepublish` injects — but the main package is published below with
      # `--ignore-scripts` (that hook shells out to child `npm publish` calls
      # that don't inherit our OIDC context), so prepublish never runs and no
      # optionalDependencies are written. Publishing the platform packages
      # therefore produced orphans that only wasted a release step.
      #
      # TO MIGRATE to slim+optionalDependencies later (out of scope here):
      #   1. Run `napi prepublish -t npm` in an OIDC-capable context so it both
      #      publishes the platform packages AND rewrites the main package.json
      #      to slim (drop `*.node` from `files`, add the optionalDependencies).
      #   2. Republish the platform packages and the slimmed main package.
      # Until then, the fat bundle is the single source of the binaries.

      - name: Publish main package
        run: |
          cd crates/spaghetti-napi
          VERSION=$(node -p "require('./package.json').version")
          TAG_ARG=""
          if [[ "$VERSION" == *-* ]]; then
            TAG_ARG="--tag next"
            echo "Prerelease detected ($VERSION) — publishing with --tag next"
          fi
          npm publish --provenance --access public --registry https://registry.npmjs.org --ignore-scripts $TAG_ARG
